<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>coil 关卡浏览器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+SC:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f2f3f1; --panel: #fbfbfa; --line: #d8dad4; --ink: #23281f; --muted: #6b7263;
    --wall: #c9ccc2; --free: #ffffff; --accent: #e8501f;
    --trail-a: #2f6db3; --trail-b: #e8501f; --start: #1a9950;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14170f; --panel: #1b1f15; --line: #2e3327; --ink: #e6e8de; --muted: #98a08b;
      --wall: #2b2f24; --free: #0d1008; --accent: #ff6a33;
      --trail-a: #5b93d6; --trail-b: #ff6a33; --start: #38c172;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans SC", "Noto Sans SC", system-ui, sans-serif; line-height: 1.55; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 18px 50px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font-family: "IBM Plex Mono", monospace; font-size: 20px; margin: 0 14px 0 0; letter-spacing: .04em; }
  .nav { display: flex; align-items: center; gap: 6px; }
  button, input[type=number] {
    font-family: "IBM Plex Mono", monospace; font-size: 14px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=number] { width: 90px; text-align: center; }
  .tag { font-family: "IBM Plex Mono", monospace; font-size: 12px; padding: 2px 9px; border-radius: 10px;
    border: 1px solid var(--line); color: var(--muted); }
  .tag.solved { color: var(--start); border-color: var(--start); }
  .tag.unsolved { color: var(--accent); border-color: var(--accent); }
  .row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .board-panel { flex: 1 1 620px; min-width: 340px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 12px; }
  .cap { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; letter-spacing: .05em; }
  #cv { display: block; max-width: 100%; height: auto; image-rendering: pixelated; margin: 0 auto; }
  .ctrl { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .ctrl input[type=range] { flex: 1; accent-color: var(--accent); }
  .side { flex: 0 1 340px; min-width: 290px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 15px; }
  .card h2 { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .12em;
    color: var(--muted); margin: 0 0 8px; font-weight: 500; text-transform: uppercase; }
  table.kv { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.kv td { padding: 3px 0; border-bottom: 1px dashed var(--line); }
  table.kv tr:last-child td { border-bottom: 0; }
  table.kv td:last-child { text-align: right; font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums; font-weight: 500; }
  .deg { display: flex; gap: 6px; align-items: flex-end; height: 60px; margin-top: 4px; }
  .deg .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    gap: 3px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); height: 100%; }
  .deg .fill { width: 100%; background: var(--trail-a); border-radius: 2px 2px 0 0; min-height: 1px; }
  .err { color: var(--accent); font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  kbd { font-family: "IBM Plex Mono", monospace; border: 1px solid var(--line); border-radius: 3px;
    padding: 0 5px; font-size: 11px; }
</style></head>
<body>
<div class="wrap">
  <header>
    <h1>coil 关卡浏览器</h1>
    <div class="nav">
      <button id="prev" title="上一关 (←)">◀</button>
      <input type="number" id="lv" min="1" value="814">
      <button id="next" title="下一关 (→)">▶</button>
      <button id="nextUnsolved" title="跳到下一未解关">下一未解</button>
    </div>
    <span class="tag" id="typetag">type ?</span>
    <span class="tag" id="soltag">…</span>
  </header>

  <div class="row">
    <div class="board-panel">
      <div class="cap"><span id="dims"></span><span id="hover">—</span></div>
      <canvas id="cv"></canvas>
      <div class="ctrl" id="playctrl" hidden>
        <button id="play" title="播放/暂停 (空格)">▶</button>
        <input type="range" id="scrub" min="0" value="0" step="1">
        <span class="cap" style="margin:0" id="movelabel"></span>
      </div>
    </div>
    <div class="side">
      <div class="card">
        <h2>盘面</h2>
        <table class="kv" id="boardkv"></table>
      </div>
      <div class="card">
        <h2>自由格度数分布</h2>
        <div class="deg" id="deg"></div>
      </div>
      <div class="card">
        <h2>解</h2>
        <table class="kv" id="solkv"></table>
      </div>
      <div class="card">
        <h2>结构特征 (boardfeat)</h2>
        <table class="kv" id="featkv"></table>
      </div>
    </div>
  </div>
  <p class="hint">键盘：<kbd>←</kbd><kbd>→</kbd> 切关，<kbd>空格</kbd> 播放解。绿格=起点，走线颜色由蓝渐橙表示先后。
     须经 tools/levelview.sh 起的本地服务访问（file:// 无法加载关卡数据）。</p>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const LV = '/coilbench/levels_all/';
const SOL = '/coil-solutions/solutions/';
let solvedSet = new Set(), levelSet = new Set(), types = {}, feats = {};
let cur = null;      // {n, w, h, cells, sol, moves, visitOrder}
let scrubTimer = null;

function tok(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function rgb(hex) {
  const h = hex.replace('#',''); const v = parseInt(h.length===3 ? [...h].map(c=>c+c).join('') : h, 16);
  return [v>>16 & 255, v>>8 & 255, v & 255];
}
function lerp(a, b, t) { return a.map((v,i)=>Math.round(v + (b[i]-v)*t)); }

async function loadIndex() {
  try {
    const t = await (await fetch(SOL)).text();
    for (const m of t.matchAll(/href="(\d+)\.sol"/g)) solvedSet.add(+m[1]);
  } catch (e) {}
  try {
    const t = await (await fetch(LV)).text();
    for (const m of t.matchAll(/href="(\d+)"/g)) levelSet.add(+m[1]);
  } catch (e) {}
  try {
    const t = await (await fetch('/coil-solver/results/boardtypes.tsv')).text();
    for (const line of t.split('\n').slice(1)) { const c = line.split('\t'); if (c[1]) types[+c[0]] = c[1]; }
  } catch (e) {}
  try {
    const t = await (await fetch('/coil-solver/results/boardfeat.jsonl')).text();
    for (const line of t.split('\n')) { if (!line.trim()) continue;
      try { const j = JSON.parse(line); feats[+j.level] = j; } catch (e) {} }
  } catch (e) {}
}

function parseBoard(txt) {
  const w = +txt.split('x=')[1].split('&')[0], h = +txt.split('y=')[1].split('&')[0];
  return { w, h, cells: txt.split('board=')[1].trim() };
}

// 滑行模拟：返回 {order: Int32Array(每格访问序,-1未访问), stops:[每步终点], ok, covered}
function simulate(w, h, cells, sx, sy, path) {
  const order = new Int32Array(w*h).fill(-1);
  const wall = i => cells[i] === 'X';
  let x = sx, y = sy, t = 0;
  if (x<0||y<0||x>=w||y>=h||wall(y*w+x)) return null;
  order[y*w+x] = t++;
  const D = {U:[0,-1], D:[0,1], L:[-1,0], R:[1,0]};
  const stops = [[x,y]];
  for (const ch of path) {
    const d = D[ch.toUpperCase()]; if (!d) continue;
    let moved = false;
    for (;;) {
      const nx = x+d[0], ny = y+d[1];
      if (nx<0||ny<0||nx>=w||ny>=h) break;
      const i = ny*w+nx;
      if (wall(i) || order[i] >= 0) break;
      x = nx; y = ny; order[i] = t++; moved = true;
    }
    stops.push([x,y]);
    if (!moved) return { order, stops, ok: false, covered: t };
  }
  let free = 0; for (let i = 0; i < w*h; i++) if (!wall(i)) free++;
  return { order, stops, ok: t === free, covered: t };
}

function kv(el, rows) {
  el.innerHTML = rows.map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}

function cellColor(i, upTo, ord, total, C) {   // 返回 [r,g,b]
  if (cur.cells[i] === 'X') return C.wall;
  if (ord && ord[i] >= 0 && ord[i] < upTo)
    return ord[i] === 0 ? C.start : lerp(C.a, C.b, ord[i] / Math.max(1, total-1));
  return C.free;
}

function draw(upTo) {   // upTo: 显示访问序 < upTo 的走线; Infinity=全部
  if (!cur) return;
  const { w, h } = cur;
  const cv = $('cv'), ctx = cv.getContext('2d');
  const C = { wall: rgb(tok('--wall')), free: rgb(tok('--free')),
              a: rgb(tok('--trail-a')), b: rgb(tok('--trail-b')), start: rgb(tok('--start')) };
  const ord = cur.sim ? cur.sim.order : null;
  const total = cur.sim ? cur.sim.covered : 1;
  const CS = Math.max(1, Math.min(36, Math.floor(880 / Math.max(w, h))));
  if (CS <= 2) {
    // 巨兽盘: 1格=1像素, 无网格缝
    cv.width = w; cv.height = h;
    const img = ctx.createImageData(w, h), px = img.data;
    for (let i = 0; i < w*h; i++) {
      const c = cellColor(i, upTo, ord, total, C);
      px[i*4] = c[0]; px[i*4+1] = c[1]; px[i*4+2] = c[2]; px[i*4+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    cv.style.width = Math.min(880, w * 2) + 'px';
  } else {
    // 常规盘: 放大格径, >=6px 时格间留 1px 缝, 格子彼此分明
    const gap = CS >= 6 ? 1 : 0;
    cv.width = w * CS; cv.height = h * CS;
    ctx.fillStyle = gap ? tok('--line') : `rgb(${C.free.join(',')})`;
    ctx.fillRect(0, 0, cv.width, cv.height);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const c = cellColor(y*w + x, upTo, ord, total, C);
      ctx.fillStyle = `rgb(${c.join(',')})`;
      ctx.fillRect(x*CS, y*CS, CS - gap, CS - gap);
    }
    cv.style.width = '';
  }
}

function stepsUpTo(k) {   // 前 k 步覆盖的访问序上限
  if (!cur.sim) return 0;
  if (k >= cur.sim.stops.length - 1) return Infinity;
  const [x, y] = cur.sim.stops[k];
  return cur.sim.order[y*cur.w + x] + 1;
}

async function show(n) {
  stopPlay();
  $('lv').value = n;
  history.replaceState(null, '', '#' + n);
  let txt;
  try {
    const r = await fetch(LV + n); if (!r.ok) throw 0;
    txt = await r.text();
  } catch (e) {
    $('dims').textContent = ''; $('boardkv').innerHTML = '';
    $('cv').getContext('2d').clearRect(0,0,$('cv').width,$('cv').height);
    kv($('boardkv'), [['状态', `<span class="err">关卡 ${n} 加载失败</span>`]]);
    return;
  }
  const { w, h, cells } = parseBoard(txt);
  cur = { n, w, h, cells, sim: null };
  let walls = 0; for (const c of cells) if (c === 'X') walls++;
  const free = w*h - walls;
  // 度数分布
  const deg = [0,0,0,0,0];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (cells[y*w+x] === 'X') continue;
    let d = 0;
    if (x>0 && cells[y*w+x-1] !== 'X') d++;
    if (x<w-1 && cells[y*w+x+1] !== 'X') d++;
    if (y>0 && cells[(y-1)*w+x] !== 'X') d++;
    if (y<h-1 && cells[(y+1)*w+x] !== 'X') d++;
    deg[d]++;
  }
  $('dims').textContent = `L${n} · ${w}x${h}`;
  $('typetag').textContent = 'type ' + (types[n] || '?');
  kv($('boardkv'), [
    ['尺寸', `${w} x ${h}`], ['自由格', free.toLocaleString()],
    ['墙', walls.toLocaleString()], ['墙密度', (walls/(w*h)).toFixed(3)],
    ['奇偶平衡', feats[n] ? feats[n].color_balance : (free % 2 === 0 ? '偶' : '奇')],
  ]);
  $('deg').innerHTML = deg.map((c, i) =>
    `<div class="bar"><div class="fill" style="height:${Math.round(100*c/Math.max(1,free))}%"></div><span>d${i}<br>${(100*c/Math.max(1,free)).toFixed(0)}%</span></div>`).join('');
  const f = feats[n];
  kv($('featkv'), f ? [
    ['开阔度 open2x2', f.open2x2], ['岔口占比', f.junction_frac],
    ['链均长', f.chain_mean], ['最长链占比', f.chain_max_frac],
  ] : [['—', '无此关数据']]);

  // 解
  let sol = null;
  try { const r = await fetch(SOL + n + '.sol'); if (r.ok) sol = await r.text(); } catch (e) {}
  if (sol && sol.includes('path=')) {
    const sx = +sol.split('x=')[1].split('&')[0], sy = +sol.split('y=')[1].split('&')[0];
    const path = sol.split('path=')[1].trim();
    cur.sim = simulate(w, h, cells, sx, sy, path);
    $('soltag').textContent = '已解'; $('soltag').className = 'tag solved';
    kv($('solkv'), [
      ['起点', `(${sx},${sy})`], ['步数', path.length.toLocaleString()],
      ['覆盖', cur.sim ? `${cur.sim.covered.toLocaleString()} / ${free.toLocaleString()}` : '?'],
      ['回放校验', cur.sim && cur.sim.ok ? '✓ 全覆盖' : '<span class="err">✗ 不吻合</span>'],
    ]);
    $('playctrl').hidden = false;
    $('scrub').max = path.length; $('scrub').value = path.length;
    $('movelabel').textContent = path.length + '/' + path.length;
    draw(Infinity);
  } else {
    $('soltag').textContent = '未解'; $('soltag').className = 'tag unsolved';
    kv($('solkv'), [['状态', '解库中无此关']]);
    $('playctrl').hidden = true;
    draw(0);
  }
}

function stopPlay() {
  if (scrubTimer) { clearInterval(scrubTimer); scrubTimer = null; $('play').textContent = '▶'; }
}
$('play').onclick = () => {
  if (scrubTimer) { stopPlay(); return; }
  const s = $('scrub');
  if (+s.value >= +s.max) s.value = 0;
  $('play').textContent = '⏸';
  const stepMs = Math.max(8, Math.min(60, 20000 / +s.max));
  scrubTimer = setInterval(() => {
    s.value = +s.value + 1;
    s.dispatchEvent(new Event('input'));
    if (+s.value >= +s.max) stopPlay();
  }, stepMs);
};
$('scrub').addEventListener('input', () => {
  const k = +$('scrub').value;
  $('movelabel').textContent = k + '/' + $('scrub').max;
  draw(stepsUpTo(k));
});
function nav(d) {
  let n = +$('lv').value + d;
  while (levelSet.size && !levelSet.has(n) && n >= 1 && n <= Math.max(...levelSet)) n += d;
  if (n >= 1) show(n);
}
$('prev').onclick = () => nav(-1);
$('next').onclick = () => nav(1);
$('nextUnsolved').onclick = () => {
  let n = +$('lv').value + 1;
  const max = levelSet.size ? Math.max(...levelSet) : 1208;
  while (n <= max && (solvedSet.has(n) || (levelSet.size && !levelSet.has(n)))) n++;
  if (n <= max) show(n);
};
$('lv').addEventListener('change', () => show(+$('lv').value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); nav(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); nav(1); }
  if (e.key === ' ') { e.preventDefault(); if (!$('playctrl').hidden) $('play').click(); }
});
$('cv').addEventListener('mousemove', e => {
  if (!cur) return;
  const r = $('cv').getBoundingClientRect();
  const x = Math.floor((e.clientX-r.left)/r.width*cur.w), y = Math.floor((e.clientY-r.top)/r.height*cur.h);
  if (x<0||y<0||x>=cur.w||y>=cur.h) return;
  let s = `(${x},${y})`;
  if (cur.sim && cur.sim.order[y*cur.w+x] >= 0) s += ' 序' + cur.sim.order[y*cur.w+x];
  $('hover').textContent = s;
});
$('cv').addEventListener('mouseleave', () => $('hover').textContent = '—');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () =>
  draw($('playctrl').hidden ? 0 : stepsUpTo(+$('scrub').value)));

loadIndex().then(() => show(+(location.hash.slice(1) || $('lv').value)));
</script>
</body></html>

# EVOLVE-PLAN P3: OpenEvolve 配置 —— manual 档（Claude Code 会话当 mutation 后端）
#
# 两档驱动方式（都不要 API key）：
#   manual 档（本文件）: mutation 请求落到 queue/<id>.json，由 CC 会话读题、
#     写 <id>.answer.json 应答（{"answer": "..."}）。CC 带着全部项目记忆出题,质量档。
#     跑法: cd evolve && python3 -m openevolve.cli policy.h evaluator.py \
#              --config config.yaml --iterations 30
#   auto 档（config-auto.yaml）: provider=claude_code, 每次变异 shell 出
#     `claude -p`（CLI 订阅鉴权）,无人值守挂机档。
# 断点续跑: --checkpoint openevolve_output/checkpoints/checkpoint_<N>

max_iterations: 30
checkpoint_interval: 5
language: c
file_suffix: .h
diff_based_evolution: true      # 只做小 diff，别整文件重写

llm:
  manual_mode: true
  # 相对启动目录的路径 —— 按文件头文档跑法 cd evolve && openevolve.cli 启动
  _manual_queue_dir: "queue"
  models:
    - name: "claude-code-session"
      weight: 1.0
  temperature: 0.8
  max_tokens: 8192

prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  system_message: |
    你在进化 Coil 求解器的策略头文件 policy.h（分支排序 / 演绎武器触发密度 /
    搜索预算调度）。硬规则：
    1. 只许改 EVOLVE-BLOCK 标记之间的内容；函数签名与宏名不许动。
    2. 不许发明新剪枝——你只决定"先试哪个分支、多久触发一次演绎、预算多大"。
       任何会跳过合法分支的改动都会被 REFSOL 硬门判 0 分。
    3. 每次改动要小而有明确机制假设（一个可证伪的想法），别大杂烩。
    4. 评分: t1_frac(校准21关全过) + t1_node_score(节点数 vs 基线) +
       hard_score(6个深树探针,其中 L271/L287 基线解不动,解出即大幅得分)。
    5. 当前主攻(2026-08-28 定向): 深树探针里 195/223/271/287 是"零信息族"
       (全局传播固定 0 边、起点候选 100% 保留,与前线真墙 L814 同族)。
       L814 病理实测: 探针段占大头(2298s vs 同类 217s); 扫荡首轮预算 3M
       但树中位仅 3019 节点(超标 1000 倍),预算被少数硬树垄断。
       最有希望的方向: ① 零信息类探针预算重标定 ② SWEEP0 按中位树定标
       (30k~100k 起步,交给 Luby 阶梯爬) ③ ADAPT 武器默认开巡逻深树。
    6. 已知死路(别重新发明,全库见 research/dead_ends.jsonl):
       - 割点/连通类规则: 盘面双连通,0 触发白付常数(信息在度里不在连通性里)
       - 每节点全量传播: 周期<128 成本抵消; 正确形态是周期触发+命中率自调(已有)
       - 随机重启在解唯一/极少的盘上是负作用(v2~v5 定谳); Luby 只配大预算扫荡用
       - beam 系全灭: Warnsdorff 区分度不够,留不住正确状态
       - 预算按怪物树标定是 bug 之源: SWEEP 必须按赢家树量级标(276 倍教训)
       - probing 类"多算多剪": 先看边际证伪量,89% 时间 0 证伪的先例在案

database:
  population_size: 60
  num_islands: 3                # prune-密度岛 / 排序岛 / 调度岛靠迁移自然分化
  migration_interval: 15
  migration_rate: 0.1
  elite_selection_ratio: 0.15
  exploration_ratio: 0.25
  # MAP-Elites 行为描述符（P1 结论: 结构同质,多样性必须来自行为）
  feature_dimensions:
    - deduction_frac            # 演绎击杀占比(风格: 传播派 vs 几何派)
    - b_over_a                  # B型/A型节点比(风格: 致密盘特化 vs 开阔盘特化)
  feature_bins: 8

evaluator:
  timeout: 1800                 # 单候选全评测墙钟上限(秒)
  cascade_evaluation: true
  cascade_thresholds: [0.3, 0.55]   # stage1>=0.3 才进 stage2, stage2>=0.55 才进全量
  parallel_evaluations: 6       # 每个评测单核跑,28 核留余量
  max_retries: 1
